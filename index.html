function canonicalChapter(sub,name){
 if(CHAPTERS[sub]?.includes(name)||name===INTRO[sub]?.[0])return name;
 let v2=V2_CHAPTERS[sub]?.indexOf(name)??-1;
 if(v2<0){let old=OLD_CHAPTERS[sub]?.indexOf(name)??-1;if(old>=0)v2=OLD_TO_NEW[sub][old]}

function migrateV2(s){

  const candidate=Number.isInteger(oldIndex)?old.subject+':'+V2_TO_V3[old.subject]?.[oldIndex]:null;
  const target=(candidate&&next[candidate])||Object.values(next).find(c=>c.subject===old.subject&&c.name===canonicalChapter(old.subject,old.name));
  if(!target)return;
  let base=Math.max(0,Math.min(5,Number(old.status)||0));
  target.sections.forEach(x=>{x.status=base;x.rough=x.status===1&&old.subject==='bio'});
  target.legacyModules=(old.modules||[]).map(m=>({...m}));
  (old.modules||[]).forEach(m=>{
   const exact=target.sections.find(x=>x.name===m.name);
   if(exact){exact.status=Math.max(0,Math.min(5,Number(m.status)||0));exact.rough=exact.status===1&&old.subject==='bio'}
  });
  target.legacyChapterName=old.name;
 });
 (s.questions||[]).forEach(q=>{q.chapter=canonicalChapter(q.subject,q.chapter)});

 s.chapters=next;s.version=3;s.reviews ||= {};s.notes ||= {};s.chapterHistory ||= [{date:today(),phys:20,bio:20,cell:0}];

}

function parseQuestionJson(data){

  if(!row||typeof row!=='object'||Array.isArray(row))throw Error(`第 ${index+1} 题格式错误`);
  const labels={phys:'phys',bio:'bio',cell:'cell',生理:'phys',生理学:'phys',生化:'bio',生物化学与分子生物学:'bio',细胞:'cell',医学细胞生物学:'cell'};

  if(!subject)throw Error(`第 ${index+1} 题的科目无效，请用 phys / bio / cell 或中文科目名`);
  const title=String(row.title??row['题目']??'').trim();
  if(!title)throw Error(`第 ${index+1} 题缺少题目`);
  const importance=Number(row.importance??row['重要程度']??3);
  if(!Number.isInteger(importance)||importance<1||importance>5)throw Error(`第 ${index+1} 题的重要程度须为 1—5`);
  const masteryRaw=row.mastery??row['熟练度']??0;
  const mastery=typeof masteryRaw==='string'&&!/^\d+$/.test(masteryRaw)?MASTERY.indexOf(masteryRaw):Number(masteryRaw);
  if(!Number.isInteger(mastery)||mastery<0||mastery>4)throw Error(`第 ${index+1} 题的熟练度无效`);

  const lastReview=String(row.lastReview??row['最近一次复习日期']??'');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(due)||lastReview&&!/^\d{4}-\d{2}-\d{2}$/.test(lastReview))throw Error(`第 ${index+1} 题的日期须为 YYYY-MM-DD`);

  const real=realRaw===true||realRaw===1||realRaw==='1'||realRaw==='是'||realRaw==='true';
  const chapter=canonicalChapter(subject,String(row.chapter??row['所属章节']??'').trim());
  return {id:uid(),sourceId:String(row.sourceId??''),sourceChapter:String(row.sourceChapter??''),subject,chapter,module:String(row.module??row.section??row['所属节']??'').trim(),title,importance,real,lastReview,due,mastery,framework:String(row.framework??row['标准答案/答题框架']??row['标准答案']??''),myAnswer:String(row.myAnswer??row['我的答案']??''),interval:Number(row.interval)||0,reps:Number(row.reps)||0};
 });

function adaptiveReplan(){let from=today()<START?START:today(),to=endDate();if(to<from)return;let old=state.tasks,dates=[];for(let d=from;d<=to;d=addDays(d,1))dates.push(d);let pools={};Object.keys(CHAPTERS).forEach(sub=>{let list=Object.values(state.chapters).filter(c=>c.subject===sub&&!c.intro);pools[sub]=list.map(c=>({name:c.name,score:chapterPercent(c),section:c.sections.slice().sort((a,b)=>a.status-b.status)[0]})).sort((a,b)=>a.score-b.score||CHAPTERS[sub].indexOf(a.name)-CHAPTERS[sub].indexOf(b.name))});dates.forEach((d,di)=>{let kept=(old[d]||[]).filter(t=>t.done||t.custom||t.origin);let fresh=makeDay(state,d).filter(t=>!kept.some(k=>k.title===t.title&&k.subject===t.subject));fresh.forEach(t=>{if(['cell','bio','phys'].includes(t.subject)){let list=pools[t.subject],focus=list[(di+Math.floor(di/Math.max(1,list.length)))%list.length];t.chapter=focus.name;t.sectionId=focus.section?.id||null;t.title=t.title.replace(/：.*/, '：'+focus.name+(focus.section?' · '+focus.section.name:''))}});state.tasks[d]=[...kept,...fresh].map((t,i)=>({...t,order:i}))});save();render();toast('已根据薄弱小节重新规划剩余时间')}

 if(a==='saveQuestion'){let title=document.getElementById('qTitle').value.trim();if(!title){toast('请填写题目');return}let q=id?state.questions.find(x=>x.id===id):null;if(!q){q={id:uid(),lastReview:'',due:today(),mastery:0,interval:0,reps:0};state.questions.push(q)}Object.assign(q,{title,subject:document.getElementById('qSub').value,chapter:document.getElementById('qChapter').value.trim(),module:document.getElementById('qModule').value.trim(),importance:Number(document.getElementById('qImportance').value),real:document.getElementById('qReal').value==='1',mastery:Number(document.getElementById('qMastery').value),myAnswer:document.getElementById('qAnswer').value,framework:document.getElementById('qFramework').value});save();closeModal();render();toast('大题已保存');return}

 if(a==='qFilter'){qFilter=el.dataset.filter;render();return}if(a==='saveReview'){let hours=Number(document.getElementById('reviewHours').value),mood=Number(document.getElementById('reviewMood').value);if(hours<0||hours>24){toast('学习小时数需在 0—24 之间');return}state.reviews[d]={hours,mood,weak:document.getElementById('reviewWeak').value,gain:document.getElementById('reviewGain').value,tomorrow:document.getElementById('reviewTomorrow').value};save();render();toast('复盘已保存');return}
 if(a==='replan'||a==='resize'){if(a==='replan'&&!confirm('重新规划会替换未来未完成的模板任务。已完成、自建和顺延任务会保留。继续？'))return;if(!saveSettingsInputs())return;if(a==='replan')adaptiveReplan();else resizeFuture();return}
 if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='648-学习数据-'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
 if(a==='importQuestions'){document.getElementById('questionImportInput').click();return}
 if(a==='questionTemplate'){let sample={questions:[{subject:'cell',chapter:'细胞的内膜系统与囊泡转运',module:'溶酶体',title:'试述溶酶体酶的合成与分选',importance:5,real:false,framework:'按合成、修饰、分选、转运和医学意义组织答案。'}]},blob=new Blob([JSON.stringify(sample,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='648-大题导入示例.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
 if(a==='import'){document.getElementById('importInput').click();return}if(a==='reset'){if(confirm('重置会清除当前浏览器内的全部任务、复盘和题库记录。建议先导出备份。确定重置？')){state=initialState();save();render();toast('已恢复初始数据')}return}
});
document.addEventListener('change',e=>{let el=e.target;if(el.dataset.action==='toggleTask'){let f=findTask(el.dataset.id);if(f){f.t.done=el.checked;save();render()}return}if(el.dataset.action==='sectionStatus'){let cid=el.dataset.chapter,m=state.chapters[cid]?.sections.find(x=>x.id===el.dataset.id);if(!m)return;m.status=Number(el.value);m.rough=false;openChapter=cid;scheduleSectionReview(cid,m.id);recordChapterProgress();save();render();return}if(el.id==='qSubject'){qSubject=el.value;render();return}});
document.addEventListener('input',e=>{if(e.target.id==='dayNote'){state.notes[e.target.dataset.date]=e.target.value;save()}});
document.getElementById('themeBtn').addEventListener('click',()=>{state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();render()});
document.getElementById('importInput').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(![1,2,3].includes(x.version)||!x.tasks||!x.questions||!x.chapters||!x.settings)throw Error('文件不是本网页导出的数据');if(!confirm('导入将替换当前浏览器中的全部数据。继续？'))return;state=x.version===1?migrateV1(x):x.version===2?migrateV2(x):x;state.reviews ||= {};state.notes ||= {};state.chapterHistory ||= [{date:today(),phys:20,bio:20,cell:0}];ensureQuestionPack(state);recordChapterProgress();save();render();toast('数据已导入')}catch(err){toast('导入失败：'+err.message)}finally{e.target.value=''}});
document.getElementById('questionImportInput').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('文件超过 5 MB');const rows=parseQuestionJson(JSON.parse(await f.text())),result=mergeQuestionRows(rows);toast(`已导入 ${result.added} 道；跳过重复 ${result.skipped} 道`)}catch(err){toast('题目导入失败：'+err.message)}finally{e.target.value=''}});
let dragged=null;document.addEventListener('dragstart',e=>{let t=e.target.closest('.task');if(!t)return;dragged={id:t.dataset.id,date:t.dataset.date};t.classList.add('dragging')});document.addEventListener('dragend',e=>{e.target.closest('.task')?.classList.remove('dragging');dragged=null});document.addEventListener('dragover',e=>{if(dragged&&e.target.closest('.task'))e.preventDefault()});document.addEventListener('drop',e=>{let target=e.target.closest('.task');if(!dragged||!target||target.dataset.date!==dragged.date)return;e.preventDefault();let arr=tasksOf(dragged.date),from=arr.findIndex(t=>t.id===dragged.id),to=arr.findIndex(t=>t.id===target.dataset.id);if(from<0||to<0)return;let [item]=arr.splice(from,1);arr.splice(to,0,item);arr.forEach((t,i)=>t.order=i);state.tasks[dragged.date]=arr;save();render()});
recordChapterProgress();save();render();
</script>
