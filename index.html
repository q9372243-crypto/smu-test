</main><script src="questions.js"></script><script>(function (root, factory) {

})(typeof globalThis !== 'undefined' ? globalThis : this, function () {

    const subject = subjects.includes(raw.subject) ? raw.subject : defaultSubject;
    const availableChapters = unique(questions.filter(q => q.subject === subject).map(q => q.chapter).filter(Boolean));
    const hasChapterSelection = Array.isArray(raw.chapters);
    const requestedChapters = hasChapterSelection ? raw.chapters : [];
    const validChapters = requestedChapters.filter(chapter => availableChapters.includes(chapter));
    const chapters = hasChapterSelection && requestedChapters.length === 0 ? [] : (validChapters.length ? unique(validChapters) : availableChapters);
    const hasTypeSelection = Array.isArray(raw.types);
    const requestedTypes = hasTypeSelection ? raw.types : [];
    const validTypes = requestedTypes.filter(type => TYPES.includes(type));

      subject,
      chapters,
      types,
      scope: SCOPES.includes(raw.scope) ? raw.scope : 'all',
      order: ORDERS.includes(raw.order) ? raw.order : 'sequential',
      studyMode: STUDY_MODES.includes(raw.studyMode) ? raw.studyMode : 'quiz',
      limit,
    };
  }

  function filterQuestions(questions, settings, progress) {
    questions = Array.isArray(questions) ? questions : [];
    settings = asObject(settings);
    progress = asObject(progress);
    const chapters = new Set(Array.isArray(settings.chapters) ? settings.chapters : []);
    const types = new Set(Array.isArray(settings.types) ? settings.types : []);
    return questions.filter(q => {
      if (q.subject !== settings.subject || !chapters.has(q.chapter) || !types.has(q.type)) return false;
      const state = asObject(progress[q.id]);
      switch (settings.scope) {
        case 'unseen': return !(Number(state.attempts) > 0);
        case 'wrong': return Number(state.wrong) > 0;
        case 'favorite': return state.favorite === true;
        case 'note': return typeof state.note === 'string' && state.note.trim().length > 0;
        case 'key': return q.outlineTag === '697重点';
        default: return true;
      }
    });
  }

  function orderedQuestions(questions, order, random) {
    const result = Array.isArray(questions) ? [...questions] : [];
    if (order !== 'random') return result;
    random = typeof random === 'function' ? random : Math.random;
    for (let i = result.length - 1; i > 0; i -= 1) {
      const j = Math.floor(random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function createSession(questionIds, settings, options) {
    options = asObject(options);
    const now = Number.isFinite(options.now) ? options.now : Date.now();
    return {
      dataVersion: String(options.dataVersion || ''),
      questionIds: unique((Array.isArray(questionIds) ? questionIds : []).filter(Boolean)),
      index: 0,
      answers: {},
      settings: { ...asObject(settings) },
      isMock: options.isMock === true,
      mockPoints: { ...asObject(options.mockPoints) },
      mockTotal: Number(options.mockTotal) || 0,
      completed: false,
      createdAt: now,
      updatedAt: now,
    };
  }

  function restoreSession(raw, questions, dataVersion) {
    raw = asObject(raw);
    if (raw.completed === true || String(raw.dataVersion || '') !== String(dataVersion || '')) return null;
    const validIds = new Set((Array.isArray(questions) ? questions : []).map(q => q.id));
    const questionIds = unique((Array.isArray(raw.questionIds) ? raw.questionIds : []).filter(id => validIds.has(id)));
    if (!questionIds.length) return null;
    const answers = {};
    const rawAnswers = asObject(raw.answers);
    questionIds.forEach(id => {
      if (rawAnswers[id] && typeof rawAnswers[id] === 'object') answers[id] = { ...rawAnswers[id] };
    });
    const index = Math.max(0, Math.min(questionIds.length - 1, Number.isInteger(raw.index) ? raw.index : 0));
    return {
      ...raw,
      questionIds,
      index,
      answers,
      settings: { ...asObject(raw.settings) },
      mockPoints: { ...asObject(raw.mockPoints) },
      mockTotal: Number(raw.mockTotal) || 0,
      completed: false,
    };
  }

  function canResume(raw, questions, dataVersion) {
    return restoreSession(raw, questions, dataVersion) !== null;
  }

  function updateSession(session, changes, now) {
    session = asObject(session);
    changes = asObject(changes);
    return { ...session, ...changes, updatedAt: Number.isFinite(now) ? now : Date.now() };
  }

  function completeSession(session, now) {

  }

  function progressEntry(value) {
    value = asObject(value);
    return {
      ...value,
      attempts: Number(value.attempts) || 0,
      correct: Number(value.correct) || 0,
      wrong: Number(value.wrong) || 0,
      favorite: value.favorite === true,
      note: typeof value.note === 'string' ? value.note : '',
    };
  }

  function updateProgressEntry(progress, questionId, updater) {
    progress = asObject(progress);
    const current = progressEntry(progress[questionId]);
    const next = typeof updater === 'function' ? updater(current) : current;
    return { ...progress, [questionId]: progressEntry(next) };
  }

  function toggleFavorite(progress, questionId) {
    return updateProgressEntry(progress, questionId, current => ({ ...current, favorite: !current.favorite }));
  }

  function setNote(progress, questionId, note) {
    const clean = typeof note === 'string' ? note.trim() : '';

  }

  function mockEligibleQuestions(questions) {

    progressEntry, updateProgressEntry, toggleFavorite, setNote,

</script><script>(function () {

  const STORAGE_KEY = "basicMedical697ProgressV2";
  const SETTINGS_KEY = "basicMedical697SettingsV1";
  const SESSION_KEY = "basicMedical697SessionV1";

  const questions = quizData.questions;

  let activeSession = null;
  let session = [];
  let index = 0;
  let answers = {};

  let mockPoints = {};

  function loadProgress() { try { const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));return saved&&typeof saved==='object'&&!Array.isArray(saved)?saved:{} } catch { return {} } }
  function loadObject(key) { try { const value = JSON.parse(localStorage.getItem(key)); return value && typeof value === 'object' && !Array.isArray(value) ? value : null } catch { return null } }
  function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true } catch { return false } }
  function saveProgress() { store(STORAGE_KEY, progress) }
  function saveSettings() { store(SETTINGS_KEY, settings) }
  function esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
  function selectedValues(name) { return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(input => input.value) }
  function subjectQuestions(subject = settings.subject) { return questions.filter(q => q.subject === subject) }
  function chaptersForSubject(subject = settings.subject) { return [...new Set(subjectQuestions(subject).map(q => q.chapter))] }

  function syncSettingsFromForm() {
    settings = QuizState.normalizeSettings({
      subject: settings.subject,
      chapters: selectedValues('chapter'),

      scope: document.getElementById('scope').value,
      order: document.getElementById('order').value,
      studyMode: document.getElementById('studyMode').value,

    renderSetupStats();
  }

  function renderSetup() {
    document.querySelectorAll('.subject-tab').forEach(button => button.classList.toggle('active', button.dataset.subject === settings.subject));
    const counts = {};

    ).join('');

    document.getElementById('order').value = settings.order;
    document.getElementById('studyMode').value = settings.studyMode;
    document.getElementById('limit').value = String(settings.limit);

  function renderSetupStats() {

  }

  function renderResumeButton() {

    activateSession(activeSession);
  }

  function resumeLast() {
    const restored = QuizState.restoreSession(loadObject(SESSION_KEY), questions, dataVersion);
    if (!restored) { renderResumeButton(); return alert('没有可以继续的未完成刷题记录。') }
    activateSession(restored);
  }

    activeSession = restored;

    answers = { ...restored.answers };
    isMock = restored.isMock === true;

  function persistSession() {

    document.getElementById('counter').textContent = `${index + 1}/${session.length}（剩余${session.length - index - 1}题）`;

    const correct = Object.values(answers).filter(item => item.correct === true).length;
    const earned = Object.values(answers).reduce((sum, item) => sum + (item.points || 0), 0);
    document.getElementById('score').textContent = isMock ? `已作答 ${done} · 得分 ${earned}/${mockTotal}` : `已答 ${done} · 正确 ${correct}`;
    const needsReview = q.structureStatus !== 'complete' || q.answerStatus !== 'available' || (q.reviewReasons || []).length > 0;
    document.getElementById('tags').innerHTML = `<span class="tag">${esc(q.subject)}</span><span class="tag">${esc(q.chapter)}</span><span class="tag">${esc(q.type)}${q.choiceSubtype ? ` · ${esc(q.choiceSubtype)}` : ''}</span>${q.outlineTag === '697重点' ? '<span class="tag key">697重点</span>' : ''}${needsReview ? '<span class="tag">原题待核对 · 暂不判分</span>' : ''}`;
    document.getElementById('stem').textContent = q.stem;
    const favoriteButton = document.getElementById('favoriteBtn');
    favoriteButton.textContent = itemProgress.favorite ? '★ 已收藏' : '☆ 收藏此题';
    favoriteButton.classList.toggle('favorite', itemProgress.favorite);
    const note = document.getElementById('questionNote');
    note.value = itemProgress.note;
    document.getElementById('noteState').textContent = itemProgress.note ? '已保存' : '';

    const box = document.getElementById('options');
    const written = document.getElementById('written');
    const actions = document.getElementById('actions');
    const feedback = document.getElementById('feedback');
    feedback.className = 'feedback hidden';
    feedback.innerHTML = '';
    if (q.type === '选择题') {
      written.classList.add('hidden');
      const multi = (q.answer || '').replace(/[^A-E]/g, '').length > 1;
      box.innerHTML = (q.options || []).map(option => `<label class="option ${(state.selected || []).includes(option.label) ? 'chosen' : ''}"><input type="${multi ? 'checkbox' : 'radio'}" name="choice" value="${option.label}" ${(state.selected || []).includes(option.label) ? 'checked' : ''} ${state.submitted ? 'disabled' : ''}> <b>${option.label}.</b> <span>${esc(option.text)}</span></label>`).join('') || '<div class="notice">原题选项未能完整恢复，可先查看题干；该题暂不判分。</div>';
      box.querySelectorAll('input').forEach(input => { input.onchange = () => {
        answers[q.id] = { ...state, selected: [...box.querySelectorAll('input:checked')].map(item => item.value) };
        persistSession(); renderQuestion();
      } });
      actions.innerHTML = state.submitted ? '<button class="alt" id="showFeedback">查看答案与解析</button>' : `<button id="submitChoice">${needsReview ? '保存作答并查看题目状态' : '提交并查看答案'}</button>`;
      if (state.submitted) showFeedback(q, state);
      else document.getElementById('submitChoice').onclick = () => submitChoice(q);
    } else {
      box.innerHTML = '';
      written.classList.remove('hidden');
      written.value = state.text || '';
      written.disabled = !!state.submitted;
      written.oninput = () => { answers[q.id] = { ...answers[q.id], text: written.value }; persistSession() };
      actions.innerHTML = state.submitted ? (!needsReview ? '<button data-rate="mastered">掌握</button><button class="alt" data-rate="partial">部分掌握</button><button class="alt" data-rate="unknown">不掌握</button>' : '<span class="notice">作答已保存在本机；本题核对前暂不判分。</span>') : '<button id="reveal">保存作答并查看参考要点</button>';
      if (state.submitted) {
        showFeedback(q, state);
        actions.querySelectorAll('[data-rate]').forEach(button => { button.onclick = () => rateSubjective(q, button.dataset.rate) });
      } else document.getElementById('reveal').onclick = () => revealSubjective(q);
    }
    if (settings.studyMode === 'study') showFeedback(q, state);
    document.getElementById('prevBtn').disabled = index === 0;
    document.getElementById('nextBtn').textContent = index === session.length - 1 ? '完成' : '下一题';
    persistSession();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function recordAttempt(q, correct) {
    progress = QuizState.updateProgressEntry(progress, q.id, item => ({
      ...item,
      attempts: item.attempts + 1,
      correct: item.correct + (correct === true ? 1 : 0),
      wrong: item.wrong + (correct === false ? 1 : 0),
      last: Date.now(),
    }));
    saveProgress();
  }

  function submitChoice(q) {
    const selected = [...document.querySelectorAll('#options input:checked')].map(input => input.value).sort();
    if (!selected.length) return alert('请先选择答案。');
    const scorable = q.answerStatus === 'available' && q.structureStatus === 'complete' && !(q.reviewReasons || []).length;
    const correctSet = [...new Set((q.answer || '').match(/[A-E]/g) || [])].sort();
    const correct = scorable ? selected.join('') === correctSet.join('') : null;
    answers[q.id] = { ...answers[q.id], selected, submitted: true, correct, points: isMock && correct ? (mockPoints[q.id] || 0) : 0 };
    recordAttempt(q, correct);
    persistSession(); renderQuestion();
  }

  function revealSubjective(q) {
    const text = document.getElementById('written').value;
    answers[q.id] = { ...answers[q.id], text, submitted: true, correct: null };
    recordAttempt(q, null);
    persistSession(); renderQuestion();
  }

  function rateSubjective(q, rate) {
    const state = answers[q.id] || {};
    const oldRate = state.rate;
    progress = QuizState.updateProgressEntry(progress, q.id, item => {
      let correct = item.correct;
      let wrong = item.wrong;
      if (oldRate === 'mastered') correct = Math.max(0, correct - 1);
      if (oldRate === 'unknown') wrong = Math.max(0, wrong - 1);
      if (rate === 'mastered') correct += 1;
      if (rate === 'unknown') wrong += 1;
      return { ...item, correct, wrong, mastery: rate, last: Date.now() };
    });
    answers[q.id] = { ...state, rate, correct: rate === 'mastered', points: isMock ? (rate === 'mastered' ? (mockPoints[q.id] || 0) : rate === 'partial' ? (mockPoints[q.id] || 0) / 2 : 0) : 0 };
    saveProgress(); persistSession(); renderQuestion();
  }

  function showFeedback(q, state) {
    const feedback = document.getElementById('feedback');
    const scorable = q.answerStatus === 'available' && q.structureStatus === 'complete' && !(q.reviewReasons || []).length;
    feedback.className = 'feedback' + (q.type === '选择题' && scorable && state.correct === false ? ' bad' : '');
    const analysis = q.analysis || {};
    const optionAnalysis = analysis.options || {};
    const notices = [];
    if (q.structureStatus !== 'complete') notices.push('原题选项未完整恢复，本题暂不判分。');
    if (q.answerStatus !== 'available') notices.push('原题库未附答案，暂不判分。');
    if ((q.reviewReasons || []).length) notices.push('本题仍在待查原题清单中，核对前暂不判分。');
    if (q.analysisStatus !== 'available') notices.push('解析待后续补充。');
    if (analysis.referenceStatus === 'needs-review') notices.push('现有答案或解析仍需人工复核。');
    const status = notices.length ? `<div class="notice">${notices.map(esc).join('<br>')}</div>` : analysis.optionRationalesComplete === false ? '<div class="notice">原书提供了整题解析，但没有逐字覆盖全部 A–E 选项；逐项区按原书判别依据与答案键说明。</div>' : '';
    const optionHtml = q.type === '选择题' && q.analysisStatus === 'available' ? (q.options || []).map(option => `<div class="rationale"><b>${option.label}. ${esc(option.text)}</b><br>${esc(optionAnalysis[option.label] || '该选项的专项解析待后续补充。')}</div>`).join('') : '';
    feedback.innerHTML = `${status}<h3>参考答案</h3><div class="answer">${esc(q.answerStatus === 'available' ? (q.answer || '待核对') : '原题库未附答案，暂不判分')}</div><h3>解析</h3><div>${esc(analysis.summary || '解析待后续补充')}</div>${optionHtml ? `<h3>逐项分析</h3>${optionHtml}` : ''}<h3>解题思路</h3><div>${esc(q.solutionApproach || '解题思路待后续补充')}</div><h3>解题技巧</h3><div>${esc(q.tips || '解题技巧待后续补充')}</div>`;
    feedback.classList.remove('hidden');
  }

  function move(delta) {
    if (delta > 0 && index === session.length - 1) return finishSession();
    index = Math.max(0, Math.min(session.length - 1, index + delta));
    persistSession(); renderQuestion();
  }

  function finishSession() {
    const done = Object.values(answers).filter(item => item.submitted).length;
    const earned = Object.values(answers).reduce((sum, item) => sum + (item.points || 0), 0);
    if (activeSession) { activeSession = QuizState.completeSession(activeSession); store(SESSION_KEY, activeSession) }
    alert(isMock ? `模拟考试完成：${done}/${session.length} 题已作答，得分 ${earned}/${mockTotal}。` : `本轮完成：${done}/${session.length} 题已作答。`);
    backToSetup();
  }

  function backToSetup() {
    document.getElementById('quiz').classList.add('hidden');
    document.getElementById('setup').classList.remove('hidden');
    renderSetup();
  }

  document.querySelectorAll('.subject-tab').forEach(button => { button.onclick = () => {
    const chapters = button.dataset.subject === settings.subject ? settings.chapters : ['__all_for_new_subject__'];
    settings = QuizState.normalizeSettings({ ...settings, subject: button.dataset.subject, chapters }, questions);
    saveSettings(); renderSetup();
  } });
  document.querySelectorAll('input[name="qtype"],#scope,#order,#studyMode,#limit').forEach(input => input.addEventListener('change', syncSettingsFromForm));
  document.getElementById('toggleChapters').onclick = event => {
    const inputs = [...document.querySelectorAll('input[name="chapter"]')];
    const all = inputs.every(input => input.checked);
    inputs.forEach(input => { input.checked = !all });
    event.target.textContent = all ? '全选' : '全不选';
    syncSettingsFromForm();
  };
  document.getElementById('startBtn').onclick = startCurrent;
  document.getElementById('resumeBtn').onclick = resumeLast;
  document.getElementById('mockBtn').onclick = startMock;
  document.getElementById('resetBtn').onclick = () => {
    if (!confirm('确定清除本机的做题记录、收藏、笔记、筛选和未完成进度吗？')) return;
    [STORAGE_KEY, SETTINGS_KEY, SESSION_KEY].forEach(key => localStorage.removeItem(key));
    progress = {};
    settings = QuizState.normalizeSettings(null, questions);
    activeSession = null;
    renderSetup();
    alert('本机记录已清除。');
  };
  document.getElementById('favoriteBtn').onclick = () => {
    const q = session[index];
    progress = QuizState.toggleFavorite(progress, q.id);
    saveProgress(); renderQuestion();
  };
  document.getElementById('questionNote').oninput = event => {
    const q = session[index];
    progress = QuizState.setNote(progress, q.id, event.target.value);
    saveProgress();
    document.getElementById('noteState').textContent = progress[q.id].note ? '已保存' : '';
  };
  document.getElementById('prevBtn').onclick = () => move(-1);
  document.getElementById('nextBtn').onclick = () => move(1);
  document.getElementById('backBtn').onclick = backToSetup;
  renderSetup();
})();
</script></body></html>
